services:
  - type: web
    name: pococonutbot-companion
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: AI_URL
        sync: false
      - key: AI_MODEL
        value: gpt-5.5
      - key: AI_COMPATIBILITY
        value: openai
      - key: AI_REPLY_MAX_TOKENS
        value: "900"
      - key: AI_RETRY_ATTEMPTS
        value: "2"
      - key: AI_RETRY_DELAY_MS
        value: "800"
      - key: FALLBACK_AI_URL
        value: https://api.minimaxi.com/v1/chat/completions
      - key: FALLBACK_AI_MODEL
        value: MiniMax-M3
      - key: FALLBACK_AI_COMPATIBILITY
        value: minimax
      - key: FALLBACK_AI_API_KEY
        sync: false
      - key: IMAGE_GENERATION_ENABLED
        value: "true"
      - key: IMAGE_API_URL
        sync: false
      - key: IMAGE_API_KEY
        sync: false
      - key: IMAGE_MODEL
        value: gpt-image-2
      - key: IMAGE_SIZE
        value: 1024x1024
      - key: IMAGE_TIMEOUT_MS
        value: "600000"
      - key: IMAGE_RETRY_ATTEMPTS
        value: "3"
      - key: IMAGE_UNDERSTANDING_REQUIRE_PRIMARY
        value: "false"
      - key: STT_ENABLED
        value: "true"
      - key: STT_API_URL
        value: https://api.groq.com/openai/v1/audio/transcriptions
      - key: STT_API_KEY
        sync: false
      - key: STT_MODEL
        value: whisper-large-v3-turbo
      - key: STT_LANGUAGE
        value: zh
      - key: VOICE_DIRECT_INPUT_ENABLED
        value: "false"
      - key: TTS_ENABLED
        value: "true"
      - key: TTS_API_URL
        value: https://studio.mosi.cn/api/v1/audio/speech
      - key: TTS_API_KEY
        sync: false
      - key: TTS_MODEL
        value: moss-tts
      - key: TTS_VOICE_ID
        sync: false
      - key: TTS_TELEGRAM_MODE
        value: voice
      - key: FEISHU_TTS_VOICE_ID
        value: "2066888673848201216"
      - key: FEISHU_TTS_MAX_INPUT_CHARS
        value: "1200"
      - key: SONG_API_ENABLED
        value: "true"
      - key: SONG_API_URL
        value: https://api.suol.cc/v1/yy_sq.php
      - key: SONG_API_TOKEN
        sync: false
      - key: SONG_API_SOURCE
        value: qq
      - key: SONG_SEARCH_ATTEMPTS
        value: "3"
      - key: BOT_DISPLAY_NAME
        value: 小椰
      - key: COMPANION_MODE
        value: girlfriend
      - key: SELF_REFERENCE_IMAGE_PATH
        value: assets/persona/xiaoye-reference.jpg
      - key: SELF_APPEARANCE_DESCRIPTION
        value: 小椰的固定形象：年轻温柔的东亚女性，长深棕色自然微卷发，干净明亮的眼睛，柔和自然的微笑，清爽亲切的气质。整体感觉阳光、干净、温柔，常穿简洁的白色宽松上衣，照片风格真实自然、生活感强。
      - key: SELF_SELFIE_STYLE
        value: 真实手机自拍风格，自然光，轻微景深，画面干净，不要夸张滤镜，不要文字、水印、logo，不要多人合照。
      - key: TRIGGER_MODE
        value: smart
      - key: SMART_CLASSIFIER_ENABLED
        value: "true"
      - key: SMART_REPLY_CONFIDENCE_THRESHOLD
        value: "0.75"
      - key: AUTO_MEMORY
        value: "true"
      - key: RECENT_MESSAGE_LIMIT
        value: "12"
      - key: MEMORY_LIMIT
        value: "24"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: FEISHU_APP_ID
        sync: false
      - key: FEISHU_APP_SECRET
        sync: false
      - key: FEISHU_VERIFICATION_TOKEN
        sync: false
      - key: FEISHU_ENCRYPT_KEY
        sync: false
      - key: FEISHU_BOT_NAME
        value: 小椰
      - key: FEISHU_BOT_ALIASES
        value: 小椰,飞书营销大师
      - key: FEISHU_PROJECT_FOLDER_TOKEN
        sync: false
      - key: FEISHU_DOC_BASE_URL
        value: https://www.feishu.cn
      - key: AI_API_KEY
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL
        value: "false"
