services:
  - type: web
    name: pococonutbot-companion
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: AI_URL
        sync: false
      - key: AI_MODEL
        value: gpt-5.5
      - key: AI_COMPATIBILITY
        value: openai
      - key: AI_REPLY_MAX_TOKENS
        value: "900"
      - key: AI_RETRY_ATTEMPTS
        value: "2"
      - key: AI_RETRY_DELAY_MS
        value: "800"
      - key: FALLBACK_AI_URL
        value: https://api.minimaxi.com/v1/chat/completions
      - key: FALLBACK_AI_MODEL
        value: MiniMax-M3
      - key: FALLBACK_AI_COMPATIBILITY
        value: minimax
      - key: FALLBACK_AI_API_KEY
        sync: false
      - key: IMAGE_GENERATION_ENABLED
        value: "true"
      - key: IMAGE_API_URL
        sync: false
      - key: IMAGE_API_KEY
        sync: false
      - key: IMAGE_MODEL
        value: gpt-image-2
